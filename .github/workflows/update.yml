name: update

# Scheduled upstream monitoring. The downloader caches by (plugin, version, url, sha256),
# so unchanged packages are skipped and only genuinely updated plugins are reprocessed.
# Previously published extensions are preserved when a new conversion fails validation.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm ci

      - name: Convert updated plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/convert.py

      - name: Verify generated JavaScript parses
        run: node scripts/validate.mjs

      - name: Commit upstream updates
        run: |
          set -euo pipefail
          git config user.name "seanime-converter[bot]"
          git config user.email "seanime-converter@users.noreply.github.com"
          git add -A src generated marketplace.json reports README.md manifest-urls.txt
          [ -f config/license-cache.json ] && git add config/license-cache.json
          if git diff --cached --quiet; then
            echo "No upstream changes detected."
            exit 0
          fi
          git commit -m "chore(update): refresh converted extensions from upstream .cs3 packages"
          git push
