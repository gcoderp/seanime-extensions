name: update

# Scheduled upstream monitoring. The downloader caches by (plugin, version, url, sha256),
# so unchanged packages are skipped and only genuinely updated plugins are reprocessed.
# Previously published extensions are preserved when a new conversion fails validation.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm ci

      - name: Convert updated plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/convert.py

      - name: Verify generated JavaScript parses
        run: node scripts/validate.mjs

      - name: Commit upstream updates
        env:
          GIT_AUTHOR_NAME: "seanime-converter[bot]"
          GIT_AUTHOR_EMAIL: "seanime-converter@users.noreply.github.com"
        run: |
          set -euo pipefail
          bash scripts/commit-and-push.sh \
            "chore(update): refresh converted extensions from upstream .cs3 packages" \
            src generated marketplace.json reports README.md manifest-urls.txt config/license-cache.json
