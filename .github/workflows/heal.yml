name: heal

# One-click repair for the repository.
#
# Upgrades every generated bundle in src/ to the Seanime contract currently declared in
# seanime/types/seanime-env.d.ts and in the templates, then commits the result. It downloads
# and converts nothing, so it finishes in a couple of minutes and works even when upstream
# .cs3 packages are unreachable.
#
# Run this when validate.yml reports "N bundle(s) were generated against an older Seanime
# contract". A normal conversion run (convert.yml, any mode) also heals the repository, but
# this is the fast, deliberate way to do it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  heal:
    name: Upgrade bundles and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Install TypeScript (needed to recompile bundles)
        run: npm ci

      - name: Upgrade generated bundles
        run: python3 scripts/migrate-contract.py

      # Brings every manifest/metadata URL in line with config/settings.json and re-triages
      # bundles against the current licence policy. A no-op when nothing changed, so it is
      # safe to run every time -- and it means renaming the repository or changing
      # github_owner is fixed by this workflow rather than by a local script.
      - name: Re-sync manifests, reports, marketplace and README
        run: python3 scripts/reindex.py

      - name: Verify the repository is clean
        run: |
          set -euo pipefail
          python3 scripts/migrate-contract.py --check
          node scripts/typecheck.mjs
          node scripts/validate.mjs
          python3 scripts/check_schema.py

      - name: Commit the healed bundles
        env:
          GIT_AUTHOR_NAME: "seanime-heal[bot]"
          GIT_AUTHOR_EMAIL: "seanime-heal@users.noreply.github.com"
        run: |
          set -euo pipefail
          bash scripts/commit-and-push.sh \
            "chore(heal): upgrade generated bundles to the current Seanime contract" \
            src generated marketplace.json reports README.md manifest-urls.txt config/license-cache.json
